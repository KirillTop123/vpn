<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-token" content="__APP_TOKEN__">
<title>Сборщик баз</title>
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<aside class="side">
  <div class="brand"><span class="brand-mark"></span>Сборщик баз</div>
  <nav id="nav">
    <button data-view="collect"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5 17 17"/></svg>Новый сбор<i id="nav-job"></i></button>
    <button data-view="base"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="12" rx="2"/><path d="M3 8.5h14M8 8.5V16"/></svg>База<i id="nav-total"></i></button>
    <button data-view="funnel"><svg viewBox="0 0 20 20"><rect x="3" y="4" width="3.6" height="12" rx="1"/><rect x="8.2" y="4" width="3.6" height="8" rx="1"/><rect x="13.4" y="4" width="3.6" height="5" rx="1"/></svg>Воронка</button>
    <button data-view="today"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4.2l2.8 1.8"/></svg>Сегодня<i id="nav-today"></i></button>
    <button data-view="export"><svg viewBox="0 0 20 20"><path d="M10 3v9M6.5 8.5 10 12l3.5-3.5M4 15.5h12"/></svg>Экспорт</button>
    <button data-view="settings"><svg viewBox="0 0 20 20"><path d="M4 6h7M15 6h1M4 14h1M9 14h7"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg>Настройки</button>
  </nav>
  <div class="side-foot" id="side-foot"></div>
</aside>
<main id="main"></main>
<div class="drawer-wrap" id="drawer-wrap" hidden><div class="drawer-shade"></div><section class="drawer" id="drawer"></section></div>
<div class="toasts" id="toasts"></div>
<script src="/ui/app.js"></script>
</body>
</html>
