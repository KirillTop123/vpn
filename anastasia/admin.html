<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Админ-панель — Анастасия Губайдулина</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#120e0b;--panel:#1c1611;--panel2:#241c16;--line:rgba(236,220,196,.13);--text:#f3ebdf;--muted:#a99a87;--gold:#e2bd80;--gold2:#c3924f;--ok:#4fd18b;--bad:#ff6b6b;--warn:#f0b54a;
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--f);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font:italic 500 22px Georgia,serif;color:var(--gold);padding:6px 10px 16px}
.logo small{display:block;font:500 11px var(--f);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-style:normal;margin-top:4px}
.tabs{display:grid;gap:2px}
.tabs button{display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:10px;color:var(--muted);min-height:44px}
.tabs button:hover{background:rgba(255,255,255,.04);color:var(--text)}
.tabs button.on{background:linear-gradient(90deg,rgba(226,189,128,.18),rgba(226,189,128,.04));color:var(--text)}
.tabs .n{margin-left:auto;font-size:12px;color:var(--muted)}
main{padding:22px clamp(16px,3vw,36px) 120px;max-width:1100px;width:100%}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font:500 30px Georgia,serif;margin-right:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:rgba(226,189,128,.4)}
.btn.gold{background:linear-gradient(180deg,#e9c58a,#c3924f);color:#1b130c;border:0}
.btn.red{color:var(--bad)}
.btn.sm{min-height:34px;padding:0 10px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card h2{font:500 22px Georgia,serif;margin-bottom:12px}
.card p.d{color:var(--muted);font-size:13px;margin:-6px 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.f{display:grid;gap:5px}
.f>span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=tel],input[type=url],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#14100c}
textarea{min-height:90px;resize:vertical}
select option{background:#1c1611}
.chk{display:flex;align-items:center;gap:8px;min-height:42px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);margin-bottom:10px}
.item .thumb{width:84px;height:84px;border-radius:10px;object-fit:cover;background:#0e0b08;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;overflow:hidden;cursor:pointer;border:1px dashed var(--line)}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item .acts{display:flex;flex-direction:column;gap:6px}
.item.hidden{opacity:.55}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gi{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel2)}
.gi img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.gi .b{padding:8px;display:grid;gap:6px}
.gi .b .row{display:flex;gap:4px;flex-wrap:wrap}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tags label{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);cursor:pointer;user-select:none}
.tags input{display:none}
.tags input:checked+span{color:var(--gold)}
.tags label:has(input:checked){border-color:var(--gold);background:rgba(226,189,128,.1)}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font:500 34px Georgia,serif;color:var(--gold)}
.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:rgba(79,209,139,.4)}
.pill.warn{color:var(--warn);border-color:rgba(240,181,74,.4)}
.pill.bad{color:var(--bad);border-color:rgba(255,107,107,.4)}
.log{font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;background:#0e0b08;border-radius:12px;padding:12px;max-height:260px;overflow:auto;white-space:pre-wrap;color:var(--muted)}
.bar{position:fixed;left:250px;right:0;bottom:0;z-index:20;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:12px clamp(16px,3vw,36px);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(18,14,11,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar .st{margin-right:auto;font-size:13px;color:var(--muted)}
.price3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;padding:12px 18px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .25s;font-size:14px}
.toast.on{opacity:1}
.help{font-size:13px;color:var(--muted);line-height:1.6}
.help ol{padding-left:18px}
.help code{background:#0e0b08;padding:1px 6px;border-radius:6px;color:var(--gold)}
.menu-btn{display:none}
[hidden]{display:none!important}
a.btn,a{color:inherit;text-decoration:none}
.login{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:radial-gradient(80% 70% at 70% 0%,rgba(201,154,91,.22),transparent 60%),var(--bg)}
.login form{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;display:grid;gap:14px}
.login h1{font:italic 500 30px Georgia,serif;color:var(--gold)}
.login p{color:var(--muted);font-size:13px}
.login .err{color:var(--bad);min-height:18px}
body.locked .app,body.locked .bar{display:none}
.bk{border:1px solid var(--line);border-radius:16px;background:var(--panel2);padding:14px;margin-bottom:10px;display:grid;gap:10px}
.bk.new{border-color:rgba(226,189,128,.55);box-shadow:0 0 0 1px rgba(226,189,128,.25)}
.bk .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.bk .h b{font:500 22px Georgia,serif}
.bk .h .when{margin-left:auto;font-size:12px;color:var(--muted)}
.bk .meta{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.bk .meta span{padding:4px 10px;border-radius:999px;background:#14100c;border:1px solid var(--line)}
.bk .cm{font-size:14px;color:var(--text);background:#14100c;border-radius:10px;padding:10px 12px}
.bk .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bk select{width:auto;min-height:36px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.filters button.on{background:var(--gold);color:#1b130c;border-color:var(--gold)}
.badge{background:var(--gold);color:#1b130c;border-radius:999px;padding:0 7px;font-weight:700;font-size:11px;line-height:18px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 25% 0 0;z-index:40;transform:translateX(-105%);transition:transform .25s;height:100%}
  aside.on{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.6)}
  .menu-btn{display:inline-flex}
  .bar{left:0;flex-wrap:wrap;gap:8px}
  .bar .st{flex-basis:100%}
  .bar .btn{flex:1}
  .grid2,.grid3,.stat{grid-template-columns:1fr 1fr}
  .item{grid-template-columns:1fr}
  .item .acts{flex-direction:row;flex-wrap:wrap}
}
@media (max-width:480px){.grid2,.grid3{grid-template-columns:1fr}.price3{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body class="locked">
<div class="login" id="login"><form id="lf" autocomplete="on">
  <h1>Вход в админку</h1>
  <p id="lmode">Сайт Анастасии Губайдулиной</p>
  <label class="f" id="lemail" hidden><span>Почта</span><input type="email" id="le" autocomplete="username"></label>
  <label class="f"><span>Пароль</span><input type="password" id="lp" autocomplete="current-password" required></label>
  <div class="err" id="lerr"></div>
  <button class="btn gold" style="min-height:48px">Войти</button>
</form></div>
<div class="app">
  <aside id="side">
    <div class="logo">Губайдулина<small>админ-панель сайта</small></div>
    <nav class="tabs" id="tabs"></nav>
  </aside>
  <main id="main"></main>
</div>
<div class="bar">
  <span class="st" id="st">Загрузка…</span>
  <a class="btn" href="index.html?preview=1" target="_blank" rel="noopener">Предпросмотр</a>
  <button class="btn gold" id="pub">Опубликовать</button>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" hidden>

<script>
"use strict";
/* Админ-панель статического сайта.
   Данные сайта лежат в data.js. Правки копятся в черновике (localStorage) и публикуются
   коммитом в репозиторий через GitHub API — сервер не нужен. Доступ = персональный токен GitHub. */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = (o) => JSON.parse(JSON.stringify(o));
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (_) { return false; } }, del(k) { try { localStorage.removeItem(k); } catch (_) {} } };
const DEF_GH = { owner: "KirillTop123", repo: "vpn", branch: "gh-pages", path: "anastasia" };
let GH = Object.assign({}, DEF_GH, LS.get("gub_gh", {}));
let TOKEN = LS.get("gub_token", "") || sessionStorage.getItem("gub_token") || "";
let D = null, BASE = "";          // черновик и опубликованная версия (строкой) для сравнения
const PENDING = new Map();         // путь картинки -> dataURL, ещё не загружено в репозиторий
let TAB = location.hash.slice(1) || "bookings";

function toast(t, bad) { const e = $("#toast"); e.textContent = t; e.style.color = bad ? "var(--bad)" : ""; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2800); }
const dirty = () => JSON.stringify(D) !== BASE || PENDING.size > 0;
function save() {
  D.meta = D.meta || {};
  if (!LS.set("gub_draft", D)) toast("Черновик не сохранился в браузере — опубликуйте изменения", true);
  status();
}
function status() {
  const d = dirty();
  $("#st").innerHTML = d ? `<span class="pill warn">● Есть неопубликованные изменения${PENDING.size ? " · фото: " + PENDING.size : ""}</span>` : `<span class="pill ok">● Всё опубликовано</span>`;
}
addEventListener("beforeunload", (e) => { if (PENDING.size) { e.preventDefault(); e.returnValue = ""; } });

// ---------- загрузка опубликованных данных ----------
function loadPublished() {
  return new Promise((res) => {
    const s = document.createElement("script");
    s.src = "data.js?v=" + Date.now();
    s.onload = () => res(window.SITE_DATA || null);
    s.onerror = () => res(null);
    document.head.appendChild(s);
  });
}
(async function init() {
  const pub = await loadPublished();
  BASE = JSON.stringify(pub || {});
  const draft = LS.get("gub_draft", null);
  D = draft || clone(pub || {});
  if (draft && JSON.stringify(draft) !== BASE) toast("Открыт сохранённый черновик");
  ["services", "categories", "works", "workCats", "studio", "reviews", "reviewStats", "faq"].forEach((k) => (D[k] = D[k] || []));
  D.profile = D.profile || {}; D.announcement = D.announcement || { on: false, text: "", link: "" }; D.seo = D.seo || {};
  D.backend = D.backend || { url: "", key: "" }; D.admin = D.admin || {};
  PUBD = pub || {};
  await gate();
  renderTabs(); render(); status();
  if (BE()) { loadBookings(); setInterval(() => loadBookings(true), 60000); }
})();

// ---------- вход ----------
// С подключённой базой Supabase — настоящий вход по почте и паролю (записи защищены на сервере).
// Без базы — пароль сверяется с хешем в data.js: это замок от случайных людей, а сайт защищён токеном GitHub.
let PUBD = {};
const BE = () => (PUBD.backend && PUBD.backend.url && PUBD.backend.key ? PUBD.backend : null);
const sha = async (t) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)))].map((b) => b.toString(16).padStart(2, "0")).join("");
let SES = LS.get("gub_ses", null);
async function sb(path, opt = {}, retry = true) {
  const be = BE();
  const r = await fetch(be.url.replace(/\/$/, "") + path, { ...opt, headers: { apikey: be.key, Authorization: "Bearer " + (SES ? SES.access_token : be.key), "Content-Type": "application/json", ...(opt.headers || {}) } });
  if (r.status === 401 && retry && SES && SES.refresh_token) {
    const rr = await fetch(be.url.replace(/\/$/, "") + "/auth/v1/token?grant_type=refresh_token", { method: "POST", headers: { apikey: be.key, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: SES.refresh_token }) });
    if (rr.ok) { SES = await rr.json(); LS.set("gub_ses", SES); return sb(path, opt, false); }
    LS.del("gub_ses"); location.reload();
  }
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.message || j.msg || j.error_description || "HTTP " + r.status); }
  return r.status === 204 ? null : r.json().catch(() => null);
}
function gate() {
  return new Promise((done) => {
    const ok = () => { document.body.classList.remove("locked"); $("#login").remove(); done(); };
    if (BE()) {
      $("#lemail").hidden = false; $("#lmode").textContent = "Вход через базу записей";
      if (SES && SES.access_token && SES.expires_at * 1000 > Date.now() - 864e5 * 30) return ok();
    } else {
      if (!PUBD.admin || !PUBD.admin.passHash) return ok(); // пароль ещё не задан
      if (sessionStorage.getItem("gub_auth") === PUBD.admin.passHash) return ok();
    }
    $("#lf").addEventListener("submit", async (e) => {
      e.preventDefault(); $("#lerr").textContent = "";
      const pw = $("#lp").value;
      try {
        if (BE()) {
          const be = BE();
          const r = await fetch(be.url.replace(/\/$/, "") + "/auth/v1/token?grant_type=password", { method: "POST", headers: { apikey: be.key, "Content-Type": "application/json" }, body: JSON.stringify({ email: $("#le").value.trim(), password: pw }) });
          const j = await r.json();
          if (!r.ok) throw new Error(j.error_description || j.msg || "Неверная почта или пароль");
          SES = j; LS.set("gub_ses", SES); ok();
        } else {
          if ((await sha("gub:" + pw)) !== PUBD.admin.passHash) throw new Error("Неверный пароль");
          sessionStorage.setItem("gub_auth", PUBD.admin.passHash); ok();
        }
      } catch (er) { $("#lerr").textContent = er.message === "Invalid login credentials" ? "Неверная почта или пароль" : er.message; $("#lp").select(); }
    });
    setTimeout(() => (BE() ? $("#le") : $("#lp")).focus(), 50);
  });
}
function logout() { LS.del("gub_ses"); sessionStorage.removeItem("gub_auth"); location.reload(); }

// ---------- записи клиентов ----------
let BK = [], BKF = "new", BKERR = "";
const ST = { new: "Новая", confirmed: "Подтверждена", done: "Выполнена", cancelled: "Отменена" };
async function loadBookings(quiet) {
  if (!BE()) return;
  try { BK = await sb("/rest/v1/bookings?select=*&order=created_at.desc&limit=500"); BKERR = ""; }
  catch (e) { BKERR = e.message; }
  renderTabs(); if (TAB === "bookings" && !quiet) render(); else if (TAB === "bookings" && !document.activeElement.closest(".bk")) render();
}
function bookings() {
  if (!BE()) return hdr("Записи") + `<div class="card"><h2>Записи прямо на сайте</h2><p class="d">Сейчас заявки с сайта уходят в WhatsApp/Telegram. Чтобы они сохранялись здесь, подключите бесплатную базу Supabase — 10 минут, инструкция в разделе «Публикация и доступ».</p><button class="btn gold" data-tab-go="publish">Открыть инструкцию</button></div>`;
  const cnt = (k) => BK.filter((b) => k === "all" || b.status === k).length;
  const L = BK.filter((b) => BKF === "all" || b.status === BKF);
  const wa = (p) => String(p).replace(/\D/g, "").replace(/^8/, "7");
  return hdr("Записи", `<button class="btn" data-act="bkreload">Обновить</button><button class="btn" data-act="bkcsv">Скачать CSV</button>`) +
    (BKERR ? `<div class="card" style="color:var(--bad)">Не удалось загрузить записи: ${esc(BKERR)}</div>` : "") +
    `<div class="filters">${[["new", "Новые"], ["confirmed", "Подтверждённые"], ["done", "Выполненные"], ["cancelled", "Отменённые"], ["all", "Все"]].map(([k, t]) => `<button class="${BKF === k ? "on" : ""}" data-act="bkf" data-f="${k}">${t} · ${cnt(k)}</button>`).join("")}</div>` +
    (L.length ? L.map((b) => `<div class="bk ${b.status === "new" ? "new" : ""}">
<div class="h"><b>${esc(b.name)}</b><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a><span class="when">${new Date(b.created_at).toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</span></div>
<div class="meta"><span>${esc(b.service || "—")}${b.length ? " · " + { s: "короткие", m: "средние", l: "длинные" }[b.length] : ""}</span>${b.price ? `<span>${esc(b.price)}</span>` : ""}<span>📅 ${b.wish_date ? new Date(b.wish_date + "T12:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long" }) : "любая дата"}, ${esc((b.wish_time || "").toLowerCase())}</span>${b.source ? `<span>из: ${esc(b.source)}</span>` : ""}</div>
${b.comment ? `<div class="cm">${esc(b.comment)}</div>` : ""}
<input type="text" placeholder="Заметка мастера (видна только вам)" value="${esc(b.admin_note || "")}" data-bknote="${esc(b.id)}">
<div class="acts"><select data-bkst="${esc(b.id)}">${Object.entries(ST).map(([k, t]) => `<option value="${k}" ${b.status === k ? "selected" : ""}>${t}</option>`).join("")}</select>
<a class="btn sm" href="tel:${esc(b.phone)}">Позвонить</a><a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${wa(b.phone)}?text=${encodeURIComponent("Здравствуйте, " + b.name + "! Это Анастасия, по вашей заявке на «" + (b.service || "") + "».")}">WhatsApp</a>
<button class="btn sm red" data-act="bkdel" data-id="${esc(b.id)}">Удалить</button></div></div>`).join("") : `<div class="card"><p class="d" style="margin:0">Здесь пока пусто.</p></div>`);
}
$("#main").addEventListener("change", async (e) => {
  const t = e.target;
  try {
    if (t.dataset.bkst) { await sb("/rest/v1/bookings?id=eq." + t.dataset.bkst, { method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ status: t.value }) }); const b = BK.find((x) => x.id === t.dataset.bkst); if (b) b.status = t.value; toast("Статус: " + ST[t.value]); renderTabs(); render(); }
    if (t.dataset.bknote) { await sb("/rest/v1/bookings?id=eq." + t.dataset.bknote, { method: "PATCH", headers: { Prefer: "return=minimal" }, body: JSON.stringify({ admin_note: t.value.slice(0, 1000) || null }) }); const b = BK.find((x) => x.id === t.dataset.bknote); if (b) b.admin_note = t.value; toast("Заметка сохранена"); }
  } catch (er) { toast("Ошибка: " + er.message, true); }
});

// ---------- навигация ----------

function hdr(title, extra = "") { return `<div class="top"><button class="btn menu-btn" data-act="menu">☰</button><h1>${title}</h1>${extra}</div>`; }

const getK = (k) => k.split(".").reduce((o, p) => (o == null ? o : o[p]), D);
function setK(k, v) { const ps = k.split("."); const last = ps.pop(); const o = ps.reduce((o, p) => (o[p] = o[p] || {}), D); o[last] = v; }
function fld(k, label, type = "text", ph = "") {
  const v = getK(k);
  if (type === "textarea") return `<label class="f"><span>${label}</span><textarea data-k="${k}" placeholder="${esc(ph)}">${esc(v)}</textarea></label>`;
  if (type === "check") return `<label class="chk"><input type="checkbox" data-k="${k}" ${v ? "checked" : ""}>${label}</label>`;
  return `<label class="f"><span>${label}</span><input type="${type}" data-k="${k}" value="${esc(v)}" placeholder="${esc(ph)}"></label>`;
}
$("#main").addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.k) { setK(t.dataset.k, t.type === "checkbox" ? t.checked : t.type === "number" ? Number(t.value) : t.value); save(); }
  if (t.dataset.lk) { const [arr, i, key] = t.dataset.lk.split("|"); const o = D[arr][+i]; setList(o, key, t); save(); }
});
$("#main").addEventListener("change", (e) => { if (e.target.dataset.k || e.target.dataset.lk) { renderTabs(); if (e.target.dataset.rerender) render(); } });
function setList(o, key, t) {
  if (key === "price.s" || key === "price.m" || key === "price.l") { if (typeof o.price !== "object") o.price = { s: 0, m: 0, l: 0 }; o.price[key.slice(6)] = Number(t.value) || 0; return; }
  if (key === "price") { o.price = Number(t.value) || 0; return; }
  if (key === "rating") { o.rating = Number(t.value) || 5; return; }
  if (key === "cats") { o.cats = $$(`[data-lk^="works|${D.works.indexOf(o)}|cats"]`).filter((x) => x.checked).map((x) => x.value); return; }
  o[key] = t.type === "checkbox" ? t.checked : t.value;
}
const L = (arr, i, key, label, type = "text", ph = "") => {
  const o = D[arr][i]; const v = key.includes(".") ? (o.price || {})[key.split(".")[1]] : o[key];
  if (type === "textarea") return `<label class="f"><span>${label}</span><textarea data-lk="${arr}|${i}|${key}" placeholder="${esc(ph)}">${esc(v)}</textarea></label>`;
  if (type === "check") return `<label class="chk"><input type="checkbox" data-lk="${arr}|${i}|${key}" ${v ? "checked" : ""}>${label}</label>`;
  return `<label class="f"><span>${label}</span><input type="${type}" data-lk="${arr}|${i}|${key}" value="${esc(v)}" placeholder="${esc(ph)}"></label>`;
};
function moveBtns(arr, i) {
  return `<button class="btn sm" data-act="up" data-arr="${arr}" data-i="${i}" ${i === 0 ? "disabled" : ""} aria-label="Выше">↑</button><button class="btn sm" data-act="down" data-arr="${arr}" data-i="${i}" ${i === D[arr].length - 1 ? "disabled" : ""} aria-label="Ниже">↓</button><button class="btn sm red" data-act="del" data-arr="${arr}" data-i="${i}">Удалить</button>`;
}

// ---------- действия ----------
let imgTarget = null;
$("#main").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;

  if (a === "menu") return $("#side").classList.toggle("on");
  if (a === "copysql") { const t = $("#sqltxt"); t.select(); try { await navigator.clipboard.writeText(t.value); toast("Скопировано"); } catch (_) { document.execCommand && document.execCommand("copy"); } return; }
  if (a === "bkf") { BKF = b.dataset.f; return render(); }
  if (a === "bkreload") return loadBookings();
  if (a === "logout") return logout();
  if (a === "bkdel") { if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Точно удалить?"; return; } try { await sb("/rest/v1/bookings?id=eq." + b.dataset.id, { method: "DELETE" }); BK = BK.filter((x) => x.id !== b.dataset.id); renderTabs(); render(); toast("Запись удалена"); } catch (er) { toast("Ошибка: " + er.message, true); } return; }
  if (a === "bkcsv") { const cols = ["created_at", "status", "name", "phone", "service", "length", "price", "wish_date", "wish_time", "comment", "admin_note", "source"]; const csv = "\ufeff" + cols.join(";") + "\n" + BK.map((r) => cols.map((c) => { let v = String(r[c] == null ? "" : r[c]); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; /* защита от формул в Excel: данные приходят из публичной формы */ return '"' + v.replace(/"/g, '""') + '"'; }).join(";")).join("\n"); const u = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); const l = document.createElement("a"); l.href = u; l.download = "zapisi-" + new Date().toISOString().slice(0, 10) + ".csv"; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); return; }
  if (a === "setpw") { const p1 = $("#pw1").value, p2 = $("#pw2").value; if (p1.length < 8) return toast("Пароль — минимум 8 символов", true); if (p1 !== p2) return toast("Пароли не совпадают", true); D.admin = { passHash: await sha("gub:" + p1) }; save(); render(); return toast("Новый пароль заработает после публикации"); }
  if (a === "up" || a === "down") { const j = a === "up" ? i - 1 : i + 1; [D[arr][i], D[arr][j]] = [D[arr][j], D[arr][i]]; }
  else if (a === "del") {
    const name = (D[arr][i] && (D[arr][i].name || D[arr][i].q || D[arr][i].alt || "элемент")) || "элемент";
    if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Точно удалить?"; setTimeout(() => { b.dataset.sure = ""; b.textContent = "Удалить"; }, 3000); return; }
    if (arr === "categories" && D.services.some((s) => s.cat === D.categories[i].id)) return toast("Сначала перенесите услуги из этой категории", true);
    D[arr].splice(i, 1); toast("Удалено: " + name);
  }
  else if (a === "add" && arr === "reviewStats") D.reviewStats.push({ name: "", value: "" });
  else if (a === "addSvc") D.services.push({ id: uid("s"), cat: b.dataset.cat, name: "Новая услуга", desc: "", price: 0, img: "", featured: false });
  else if (a === "addCat") D.categories.push({ id: uid("c"), name: "Новая категория" });
  else if (a === "addWcat") D.workCats.push({ id: uid("f"), name: "Новый фильтр" });
  else if (a === "addRev") D.reviews.unshift({ id: uid("r"), name: "", date: new Date().toISOString().slice(0, 10), rating: 5, text: "", source: "Яндекс Карты" });
  else if (a === "addFaq") D.faq.push({ q: "", a: "" });
  else if (a === "addAbout") (D.profile.about = D.profile.about || []).push("");
  else if (a === "delAbout") D.profile.about.pop();
  else if (a === "bylen") { const s = D.services[i]; s.price = b.checked ? { s: +s.price || 0, m: +s.price || 0, l: +s.price || 0 } : +(s.price.m || 0); }
  else if (a === "img" || a === "addWork" || a === "addStudio" || a === "heroimg") { imgTarget = { a, arr, i }; $("#file").value = ""; $("#file").click(); return; }
  else if (a === "export") { const bl = new Blob([JSON.stringify(D, null, 2)], { type: "application/json" }); const u = URL.createObjectURL(bl); const l = document.createElement("a"); l.href = u; l.download = "sait-gubaydulina-" + new Date().toISOString().slice(0, 10) + ".json"; l.click(); setTimeout(() => URL.revokeObjectURL(u), 1000); return; }
  else if (a === "import") { const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json"; inp.onchange = async () => { try { const d = JSON.parse(await inp.files[0].text()); if (!d.profile || !d.services) throw 0; D = d; save(); renderTabs(); render(); toast("Копия загружена в черновик"); } catch (_) { toast("Это не файл копии сайта", true); } }; inp.click(); return; }
  else if (a === "reset") { if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "Нажмите ещё раз для отмены правок"; return; } D = JSON.parse(BASE); PENDING.clear(); LS.del("gub_draft"); renderTabs(); render(); status(); return toast("Правки отменены"); }
  else if (a === "ghsave") return ghSave();
  else if (a === "ghout") { TOKEN = ""; LS.del("gub_token"); sessionStorage.removeItem("gub_token"); render(); return toast("Токен удалён с устройства"); }
  else return;

});

// ---------- фото: сжатие в браузере до 1600 px WebP ----------
$("#file").addEventListener("change", async () => {
  const f = $("#file").files[0]; if (!f || !imgTarget) return;
  try {
    const url = await compress(f);
    const path = "img/u-" + Date.now().toString(36) + ".webp";
    PENDING.set(path, url);
    const { a, arr, i } = imgTarget;
    if (a === "addWork") D.works.unshift({ id: uid("w"), img: path, cats: [], caption: "", alt: "", featured: false });
    else if (a === "addStudio") D.studio.push({ img: path, caption: "" });
    else if (a === "heroimg") D.profile.heroImg = path;
    else D[arr][i].img = path;
    save(); renderTabs(); render(); toast("Фото добавлено — не забудьте опубликовать");
  } catch (_) { toast("Не получилось прочитать фото", true); }
});
function compress(file) {
  return new Promise((res, rej) => {
    const im = new Image(); const u = URL.createObjectURL(file);
    im.onload = () => {
      const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      let d = c.toDataURL("image/webp", 0.84);
      if (!d.startsWith("data:image/webp")) d = c.toDataURL("image/jpeg", 0.86); // старый Safari без WebP-кодировщика
      res(d);
    };
    im.onerror = rej; im.src = u;
  });
}

// ---------- GitHub ----------
async function gh(method, path, body) {
  const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}${path}`, {
    method, headers: { Authorization: "Bearer " + TOKEN, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const err = new Error(j.message || "HTTP " + r.status); err.status = r.status; throw err; }
  return j;
}
const ghErr = (e) => e.status === 401 ? "токен неверный или истёк" : e.status === 403 ? "у токена нет права записи (Contents: Read and write)" : e.status === 404 ? "репозиторий, ветка или папка не найдены — проверьте поля" : e.status === 409 ? "конфликт версий — повторите публикацию" : e.message;
async function ghSave() {
  GH = { owner: $("#gh-owner").value.trim(), repo: $("#gh-repo").value.trim(), branch: $("#gh-branch").value.trim(), path: $("#gh-path").value.trim().replace(/^\/|\/$/g, "") };
  TOKEN = $("#gh-token").value.trim();
  LS.set("gub_gh", GH);
  if ($("#gh-remember").checked) LS.set("gub_token", TOKEN); else { LS.del("gub_token"); sessionStorage.setItem("gub_token", TOKEN); }
  const st = $("#ghst"); st.innerHTML = '<span class="pill">Проверяю…</span>';
  try {
    const r = await gh("GET", "");
    await gh("GET", `/contents/${GH.path}/data.js?ref=${encodeURIComponent(GH.branch)}`);
    const can = r.permissions ? r.permissions.push : true;
    st.innerHTML = can ? '<span class="pill ok">Подключено — можно публиковать</span>' : '<span class="pill bad">Токен только для чтения</span>';
  } catch (e) { st.innerHTML = `<span class="pill bad">Ошибка: ${esc(ghErr(e))}</span>`; }
}
const b64 = (str) => btoa(unescape(encodeURIComponent(str)));
function log(t) { const l = $("#log"); const line = new Date().toLocaleString("ru-RU") + "  " + t; if (l) l.textContent = line + "\n" + l.textContent; LS.set("gub_log", (line + "\n" + LS.get("gub_log", "")).slice(0, 4000)); }
$("#pub").addEventListener("click", async () => {
  if (!TOKEN) { TAB = "publish"; location.hash = TAB; renderTabs(); render(); return toast("Сначала подключите доступ к GitHub", true); }
  if (!dirty()) return toast("Нет изменений для публикации");
  const btn = $("#pub"); btn.disabled = true; btn.textContent = "Публикую…";
  try {
    for (const [p, url] of [...PENDING]) {
      await gh("PUT", `/contents/${GH.path}/${p}`, { message: "Фото для сайта", content: url.split(",")[1], branch: GH.branch });
      PENDING.delete(p); log("Загружено фото " + p);
    }
    D.meta = { updated: new Date().toISOString().slice(0, 10) };
    const cur = await gh("GET", `/contents/${GH.path}/data.js?ref=${encodeURIComponent(GH.branch)}`);
    const js = "window.SITE_DATA = " + JSON.stringify(D, null, 2) + ";\n";
    await gh("PUT", `/contents/${GH.path}/data.js`, { message: "Обновление сайта из админ-панели", content: b64(js), sha: cur.sha, branch: GH.branch });
    BASE = JSON.stringify(D); LS.set("gub_draft", D); log("Опубликованы данные сайта");
    toast("Опубликовано! Сайт обновится через 1–2 минуты");
  } catch (e) { log("Ошибка: " + ghErr(e)); toast("Не опубликовано: " + ghErr(e), true); }
  btn.disabled = false; btn.textContent = "Опубликовать"; status();
});
